[build]
  command = "npm run build"
  publish = "dist"

# index.html nie hart cachen: so holt der Browser nach einem Deploy sofort den
# neuen Bundle-Verweis, ohne dass Nutzer ihren Cache leeren muessen.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Gehashte Assets (Dateiname aendert sich pro Build) duerfen dauerhaft im Cache
# bleiben.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
